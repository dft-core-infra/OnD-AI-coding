<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎮 Tetris</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
  }

  .game-wrapper {
    display: flex;
    gap: 24px;
    align-items: flex-start;
  }

  .side-panel {
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-width: 140px;
  }

  .panel-box {
    background: rgba(255,255,255,0.05);
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 16px;
    text-align: center;
    backdrop-filter: blur(10px);
  }

  .panel-box h3 {
    color: #888;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }

  .panel-box .value {
    color: #fff;
    font-size: 24px;
    font-weight: bold;
    text-shadow: 0 0 10px rgba(255,255,255,0.3);
  }

  #next-canvas {
    display: block;
    margin: 0 auto;
  }

  .board-container {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 0 60px rgba(100, 100, 255, 0.15), inset 0 0 60px rgba(0,0,0,0.3);
    border: 3px solid rgba(255,255,255,0.15);
  }

  #game-canvas {
    display: block;
    background: #0f0f3a;
  }

  .overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.75);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 16px;
    backdrop-filter: blur(4px);
    z-index: 10;
  }

  .overlay.hidden { display: none; }

  .overlay h2 {
    color: #fff;
    font-size: 32px;
    text-shadow: 0 0 20px rgba(255,255,255,0.5);
  }

  .overlay p {
    color: #aaa;
    font-size: 14px;
  }

  .btn {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    border: none;
    padding: 12px 32px;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    letter-spacing: 1px;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
  }

  .btn:hover {
    transform: scale(1.05);
    box-shadow: 0 6px 30px rgba(102, 126, 234, 0.6);
  }

  .controls-info {
    color: #555;
    font-size: 11px;
    text-align: center;
    line-height: 1.8;
    margin-top: 8px;
  }

  .controls-info kbd {
    background: rgba(255,255,255,0.1);
    padding: 2px 8px;
    border-radius: 4px;
    color: #888;
    font-family: inherit;
  }

  /* Line clear flash */
  .flash {
    animation: flashAnim 0.3s ease-out;
  }

  @keyframes flashAnim {
    0% { filter: brightness(3); }
    100% { filter: brightness(1); }
  }

  /* Particles */
  .particle {
    position: absolute;
    pointer-events: none;
    border-radius: 50%;
    animation: particleFly 0.8s ease-out forwards;
  }

  @keyframes particleFly {
    0% { opacity: 1; transform: translate(0,0) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0); }
  }
</style>
</head>
<body>

<div class="game-wrapper">
  <div class="side-panel">
    <div class="panel-box">
      <h3>Score</h3>
      <div class="value" id="score">0</div>
    </div>
    <div class="panel-box">
      <h3>Level</h3>
      <div class="value" id="level">1</div>
    </div>
    <div class="panel-box">
      <h3>Lines</h3>
      <div class="value" id="lines">0</div>
    </div>
    <div class="panel-box">
      <h3>Next</h3>
      <canvas id="next-canvas" width="100" height="100"></canvas>
    </div>
    <div class="controls-info">
      <kbd>←</kbd> <kbd>→</kbd> Move<br>
      <kbd>↑</kbd> Rotate<br>
      <kbd>↓</kbd> Soft Drop<br>
      <kbd>Space</kbd> Hard Drop<br>
      <kbd>P</kbd> Pause
    </div>
  </div>

  <div class="board-container" id="board-container">
    <canvas id="game-canvas" width="300" height="600"></canvas>
    <div class="overlay" id="start-overlay">
      <h2>🎮 TETRIS</h2>
      <p>Classic block-stacking game</p>
      <button class="btn" id="start-btn">START GAME</button>
    </div>
    <div class="overlay hidden" id="pause-overlay">
      <h2>⏸ PAUSED</h2>
      <button class="btn" id="resume-btn">RESUME</button>
    </div>
    <div class="overlay hidden" id="gameover-overlay">
      <h2>💥 GAME OVER</h2>
      <p>Final Score: <span id="final-score">0</span></p>
      <button class="btn" id="restart-btn">PLAY AGAIN</button>
    </div>
  </div>

  <div class="side-panel"></div>
</div>

<script>
const COLS = 10, ROWS = 20, BLOCK = 30;
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
const nextCanvas = document.getElementById('next-canvas');
const nctx = nextCanvas.getContext('2d');

// Colorful piece definitions
const PIECES = {
  I: { shape: [[0,0],[1,0],[2,0],[3,0]], color: '#00f5ff' },
  O: { shape: [[0,0],[1,0],[0,1],[1,1]], color: '#ffe600' },
  T: { shape: [[0,0],[1,0],[2,0],[1,1]], color: '#b44eff' },
  S: { shape: [[1,0],[2,0],[0,1],[1,1]], color: '#39ff14' },
  Z: { shape: [[0,0],[1,0],[1,1],[2,1]], color: '#ff1e5c' },
  J: { shape: [[0,0],[0,1],[1,1],[2,1]], color: '#3d7aff' },
  L: { shape: [[2,0],[0,1],[1,1],[2,1]], color: '#ff8c00' }
};

const PIECE_NAMES = Object.keys(PIECES);

let board, currentPiece, nextPiece, score, level, lines;
let gameOver, paused, dropInterval, lastDrop, animationId;
let bag = [];

// --- Board ---
function createBoard() {
  return Array.from({length: ROWS}, () => Array(COLS).fill(null));
}

// --- Bag randomizer (7-bag) ---
function fillBag() {
  const a = [...PIECE_NAMES];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getNextType() {
  if (bag.length === 0) bag = fillBag();
  return bag.pop();
}

// --- Piece object ---
function makePiece(type) {
  const p = PIECES[type];
  const shape = p.shape.map(([x,y]) => [x,y]);
  // center the piece horizontally, start near top
  const minX = Math.min(...shape.map(s=>s[0]));
  const maxX = Math.max(...shape.map(s=>s[0]));
  const w = maxX - minX + 1;
  return {
    type,
    shape,
    color: p.color,
    x: Math.floor((COLS - w) / 2) - minX,
    y: 0
  };
}

// --- Collision ---
function collides(piece, dx=0, dy=0) {
  for (const [bx,by] of piece.shape) {
    const nx = piece.x + bx + dx;
    const ny = piece.y + by + dy;
    if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
    if (ny >= 0 && board[ny][nx]) return true;
  }
  return false;
}

// --- Lock & clear ---
function lock() {
  for (const [bx,by] of currentPiece.shape) {
    const x = currentPiece.x + bx;
    const y = currentPiece.y + by;
    if (y < 0) { triggerGameOver(); return; }
    board[y][x] = currentPiece.color;
  }
  clearLines();
  spawnPiece();
}

function clearLines() {
  let cleared = [];
  for (let r = ROWS-1; r >= 0; r--) {
    if (board[r].every(c => c !== null)) {
      cleared.push(r);
    }
  }
  if (cleared.length > 0) {
    // particles
    for (const r of cleared) {
      for (let c = 0; c < COLS; c++) {
        spawnParticles(c * BLOCK + BLOCK/2, r * BLOCK + BLOCK/2, board[r][c]);
      }
    }
    for (const r of cleared.sort((a,b)=>b-a)) {
      board.splice(r, 1);
      board.unshift(Array(COLS).fill(null));
    }
    const pts = [0, 100, 300, 500, 800];
    score += (pts[cleared.length] || 0) * level;
    lines += cleared.length;
    level = Math.floor(lines / 10) + 1;
    dropInterval = Math.max(50, 1000 - (level - 1) * 80);
    updateUI();
    flashBoard();
  }
}

function spawnPiece() {
  currentPiece = nextPiece || makePiece(getNextType());
  nextPiece = makePiece(getNextType());
  if (collides(currentPiece, 0, 0)) {
    triggerGameOver();
  }
  drawNext();
}

// --- Ghost piece ---
function getGhostY() {
  let gy = 0;
  while (!collides(currentPiece, 0, gy + 1)) gy++;
  return gy;
}

// --- Drawing ---
function drawBlock(context, x, y, color, size=BLOCK, ghost=false) {
  const pad = 1;
  if (ghost) {
    context.strokeStyle = color;
    context.globalAlpha = 0.3;
    context.lineWidth = 2;
    context.strokeRect(x * size + pad, y * size + pad, size - pad*2, size - pad*2);
    context.globalAlpha = 1;
    return;
  }

  // Main fill with gradient
  const grad = context.createLinearGradient(x*size, y*size, x*size+size, y*size+size);
  grad.addColorStop(0, lighten(color, 30));
  grad.addColorStop(1, color);
  context.fillStyle = grad;
  context.fillRect(x*size + pad, y*size + pad, size - pad*2, size - pad*2);

  // Highlight top-left
  context.fillStyle = 'rgba(255,255,255,0.2)';
  context.fillRect(x*size + pad, y*size + pad, size - pad*2, 3);
  context.fillRect(x*size + pad, y*size + pad, 3, size - pad*2);

  // Shadow bottom-right
  context.fillStyle = 'rgba(0,0,0,0.25)';
  context.fillRect(x*size + pad, (y+1)*size - pad - 3, size - pad*2, 3);
  context.fillRect((x+1)*size - pad - 3, y*size + pad, 3, size - pad*2);
}

function lighten(hex, amt) {
  let r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  r = Math.min(255, r + amt); g = Math.min(255, g + amt); b = Math.min(255, b + amt);
  return `rgb(${r},${g},${b})`;
}

function drawBoard() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Grid lines
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  for (let r = 0; r <= ROWS; r++) {
    ctx.beginPath(); ctx.moveTo(0, r*BLOCK); ctx.lineTo(COLS*BLOCK, r*BLOCK); ctx.stroke();
  }
  for (let c = 0; c <= COLS; c++) {
    ctx.beginPath(); ctx.moveTo(c*BLOCK, 0); ctx.lineTo(c*BLOCK, ROWS*BLOCK); ctx.stroke();
  }

  // Board blocks
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (board[r][c]) drawBlock(ctx, c, r, board[r][c]);
    }
  }

  if (!currentPiece || gameOver) return;

  // Ghost piece
  const gy = getGhostY();
  for (const [bx,by] of currentPiece.shape) {
    const gx = currentPiece.x + bx;
    const gy2 = currentPiece.y + by + gy;
    if (gy2 >= 0) drawBlock(ctx, gx, gy2, currentPiece.color, BLOCK, true);
  }

  // Current piece
  for (const [bx,by] of currentPiece.shape) {
    const px = currentPiece.x + bx;
    const py = currentPiece.y + by;
    if (py >= 0) drawBlock(ctx, px, py, currentPiece.color);
  }
}

function drawNext() {
  nctx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
  if (!nextPiece) return;
  const s = 22;
  const minX = Math.min(...nextPiece.shape.map(p=>p[0]));
  const maxX = Math.max(...nextPiece.shape.map(p=>p[0]));
  const minY = Math.min(...nextPiece.shape.map(p=>p[1]));
  const maxY = Math.max(...nextPiece.shape.map(p=>p[1]));
  const w = (maxX - minX + 1);
  const h = (maxY - minY + 1);
  const ox = (nextCanvas.width - w * s) / 2 / s - minX;
  const oy = (nextCanvas.height - h * s) / 2 / s - minY;

  for (const [bx,by] of nextPiece.shape) {
    drawBlock(nctx, bx + ox, by + oy, nextPiece.color, s);
  }
}

// --- Particles ---
function spawnParticles(x, y, color) {
  const container = document.getElementById('board-container');
  for (let i = 0; i < 6; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = 4 + Math.random() * 6;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.background = color;
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    p.style.setProperty('--dx', (Math.random()-0.5)*120 + 'px');
    p.style.setProperty('--dy', (-20 - Math.random()*80) + 'px');
    container.appendChild(p);
    setTimeout(() => p.remove(), 800);
  }
}

function flashBoard() {
  canvas.classList.add('flash');
  setTimeout(() => canvas.classList.remove('flash'), 300);
}

// --- UI ---
function updateUI() {
  document.getElementById('score').textContent = score.toLocaleString();
  document.getElementById('level').textContent = level;
  document.getElementById('lines').textContent = lines;
}

// --- Game states ---
function triggerGameOver() {
  gameOver = true;
  cancelAnimationFrame(animationId);
  document.getElementById('final-score').textContent = score.toLocaleString();
  document.getElementById('gameover-overlay').classList.remove('hidden');
}

function gameLoop(time) {
  if (gameOver || paused) return;
  if (!lastDrop) lastDrop = time;
  if (time - lastDrop > dropInterval) {
    if (!collides(currentPiece, 0, 1)) {
      currentPiece.y++;
    } else {
      lock();
    }
    lastDrop = time;
  }
  drawBoard();
  animationId = requestAnimationFrame(gameLoop);
}

function startGame() {
  board = createBoard();
  bag = [];
  score = 0; level = 1; lines = 0;
  dropInterval = 1000;
  gameOver = false; paused = false;
  lastDrop = 0;
  currentPiece = null; nextPiece = null;
  updateUI();
  spawnPiece();
  drawNext();
  document.getElementById('start-overlay').classList.add('hidden');
  document.getElementById('gameover-overlay').classList.add('hidden');
  document.getElementById('pause-overlay').classList.add('hidden');
  if (animationId) cancelAnimationFrame(animationId);
  animationId = requestAnimationFrame(gameLoop);
}

// --- Controls ---
document.addEventListener('keydown', e => {
  if (gameOver || !currentPiece) return;

  if (e.key === 'p' || e.key === 'P') {
    paused = !paused;
    document.getElementById('pause-overlay').classList.toggle('hidden', !paused);
    if (!paused) { lastDrop = performance.now(); animationId = requestAnimationFrame(gameLoop); }
    return;
  }

  if (paused) return;

  switch(e.key) {
    case 'ArrowLeft':
      if (!collides(currentPiece, -1, 0)) currentPiece.x--;
      break;
    case 'ArrowRight':
      if (!collides(currentPiece, 1, 0)) currentPiece.x++;
      break;
    case 'ArrowDown':
      if (!collides(currentPiece, 0, 1)) { currentPiece.y++; score += 1; updateUI(); }
      lastDrop = performance.now();
      break;
    case 'ArrowUp':
      rotate(currentPiece);
      break;
    case ' ':
      e.preventDefault();
      let dy = 0;
      while (!collides(currentPiece, 0, dy+1)) dy++;
      score += dy * 2;
      updateUI();
      currentPiece.y += dy;
      lock();
      lastDrop = performance.now();
      break;
  }
  drawBoard();
});

function rotate(piece) {
  // Find center of rotation
  const original = piece.shape.map(s => [s[0], s[1]]);
  // Rotate 90° clockwise: (x,y) -> (y, -x) relative to pivot
  const cx = piece.shape.reduce((a,s)=>a+s[0],0)/piece.shape.length;
  const cy = piece.shape.reduce((a,s)=>a+s[1],0)/piece.shape.length;

  const rotated = piece.shape.map(([x,y]) => {
    const dx = x - cx, dy = y - cy;
    return [Math.round(cx + dy), Math.round(cy - dx)];
  });

  // Normalize to min 0,0
  const minX = Math.min(...rotated.map(s=>s[0]));
  const minY = Math.min(...rotated.map(s=>s[1]));
  const normed = rotated.map(([x,y]) => [x - minX, y - minY]);

  piece.shape = normed;

  // Wall kicks: try offsets
  const kicks = [0, -1, 1, -2, 2];
  for (const k of kicks) {
    if (!collides(piece, k, 0)) { piece.x += k; return; }
  }
  // Try shifting up
  if (!collides(piece, 0, -1)) { piece.y -= 1; return; }

  // If still colliding, revert
  piece.shape = original;
}

// --- Buttons ---
document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);
document.getElementById('resume-btn').addEventListener('click', () => {
  paused = false;
  document.getElementById('pause-overlay').classList.add('hidden');
  lastDrop = performance.now();
  animationId = requestAnimationFrame(gameLoop);
});

// --- Init draw ---
drawBoard();
</script>
</body>
</html>
